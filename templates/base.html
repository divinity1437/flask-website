<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% block title %}osu! Tools{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar">
        <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; width: 100%;">
            <div class="nav-brand">
                <a href="/" style="font-size: 1.5rem; font-weight: bold; color: var(--primary);">osu! Tools</a>
            </div>
            <div class="nav-links" style="display: flex; gap: 2rem;">
                <a href="/inspector">Inspector</a>
                <a href="/circleguard">Replay Analysis</a>
                <a href="/donationgoals">Donation Goals</a>
            </div>
            <div class="nav-auth">
                {% if session.user %}
                <div class="user-menu" style="display: flex; align-items: center; gap: 0.75rem;">
                    <img src="{{ session.user.avatar_url }}" style="width: 32px; height: 32px; border-radius: 50%;">
                    <span>{{ session.user.username }}</span>
                    <form method="post" action="{{ url_for('auth.logout') }}" style="display: inline;">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" style="color: var(--primary); background: none; border: 0; padding: 0;">Logout</button>
                    </form>
                </div>
                {% else %}
                <a href="/auth/login" class="login-btn" style="background: var(--primary); padding: 0.5rem 1rem; border-radius: 40px; text-decoration: none; color: white;">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block body %}{% endblock %}
    </main>

    <script>
        // Общие скрипты
        document.querySelectorAll('.nav-links a, .login-btn').forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.getAttribute('href') && !this.getAttribute('href').startsWith('#')) {
                    // обычная навигация
                }
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
